name: Bootstrap and validate GREED PIT native apps

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-native.yml"
      - "package.json"
      - "capacitor.config.json"
      - "tools/prepare_native_web.py"
      - "src/greed-pit-0.20.13.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-and-validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
        continue-on-error: true

      - name: Install Capacitor toolchain
        run: npm install --no-audit --no-fund

      - name: Prepare verified native web bundle
        run: npm run native:web

      - name: Create or sync Android project
        run: |
          set -euo pipefail
          if [ -d android ]; then
            npx cap sync android
          else
            npx cap add android
          fi

      - name: Create or sync iOS project
        run: |
          set -euo pipefail
          if [ -d ios ]; then
            npx cap sync ios
          else
            npx cap add ios
          fi

      - name: Verify store-era toolchain and native bundle
        run: |
          set -euo pipefail
          node --version
          npx cap --version
          xcodebuild -version
          xcode_major="$(xcodebuild -version | awk '/Xcode/{split($2,a,"."); print a[1]}')"
          test "$xcode_major" -ge 26
          grep -Eq 'targetSdkVersion[[:space:]]*=[[:space:]]*36' android/variables.gradle
          grep -q 'GREED PIT 0.20.13 PERFORMANCE CANDIDATE' www/index.html
          grep -q '0.20.13-native-candidate' www/index.html
          ! grep -q 'navigator.serviceWorker.register' www/index.html
          echo "Xcode 26+, Android target SDK 36, and GREED PIT 0.20.13 native bundle verified."

      - name: Build Android debug application
        run: |
          set -euo pipefail
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Build iOS simulator application unsigned
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iOS Release for generic device unsigned
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Commit generated native projects
        run: |
          set -euo pipefail
          git config user.name "greed-pit-build-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json www android ios
          if git diff --cached --quiet; then
            echo "Native projects are already synchronized."
            exit 0
          fi
          git commit -m "build: sync GREED PIT native projects"
          git pull --rebase origin main
          git push origin main
