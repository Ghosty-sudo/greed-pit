name: Validate GREED PIT native apps

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-native.yml"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "tools/prepare_native_web.py"
      - "src/greed-pit-0.20.13.html"
      - "assets/audio/**"
      - "www/**"
      - "android/**"
      - "ios/**"
      - "release/app-store/PrivacyInfo.xcprivacy"
  pull_request:
    paths:
      - ".github/workflows/bootstrap-native.yml"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "tools/prepare_native_web.py"
      - "src/greed-pit-0.20.13.html"
      - "assets/audio/**"
      - "www/**"
      - "android/**"
      - "ios/**"
      - "release/app-store/PrivacyInfo.xcprivacy"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: greed-pit-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-native:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Capacitor toolchain
        run: npm ci --no-audit --no-fund

      - name: Prepare verified native web bundle
        run: npm run native:web

      - name: Sync Android project
        run: npx cap sync android

      - name: Sync iOS project
        run: npx cap sync ios

      - name: Verify store-era toolchain and native bundle
        run: |
          set -euo pipefail
          node --version
          npx cap --version
          xcodebuild -version
          xcode_major="$(xcodebuild -version | awk '/Xcode/{split($2,a,"."); print a[1]}')"
          test "$xcode_major" -ge 26
          grep -Eq 'targetSdkVersion[[:space:]]*=[[:space:]]*36' android/variables.gradle
          grep -q 'GREED PIT 0.20.13 PERFORMANCE CANDIDATE' www/index.html
          grep -q '0.20.13-native-candidate' www/index.html
          grep -q 'CONTINUE SAVED RUN' www/index.html
          grep -q 'id="privacyOpen"' www/index.html
          ! grep -q 'navigator.serviceWorker.register' www/index.html
          test -f release/app-store/PrivacyInfo.xcprivacy
          echo "Xcode 26+, Android target SDK 36, native recovery/privacy markers, and GREED PIT 0.20.13 bundle verified."

      - name: Build Android debug application
        run: |
          set -euo pipefail
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Build iOS simulator application unsigned
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iOS Release for generic device unsigned
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify checked-in native projects are synchronized
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- package-lock.json www android ios; then
            echo "::error::Capacitor/native generated state is stale. Run npm run native:sync and commit the resulting package-lock.json, www/, android/, and ios/ changes."
            exit 1
          fi
          echo "Checked-in native projects are deterministic and synchronized."
