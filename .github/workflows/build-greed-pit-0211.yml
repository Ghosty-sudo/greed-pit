name: Build GREED PIT 0.20.11 audio candidate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-greed-pit-0211.yml"
      - "tools/build_greed_pit_0211.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build candidate from verified source
        run: python3 tools/build_greed_pit_0211.py

      - name: Check generated game JavaScript
        run: node --check /tmp/greed-pit-0211.js

      - name: Commit staged candidate
        run: |
          set -euo pipefail
          git config user.name "greed-pit-build-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/greed-pit-0.20.11.html src/greed-pit-0.20.11.sha256 loader-0211.js gp0211.*.b64 manifest-0211.webmanifest sw-0211.js
          if git diff --cached --quiet; then
            echo "0.20.11 candidate already staged."
            exit 0
          fi
          git commit -m "build: stage GREED PIT 0.20.11 audio candidate"
          git push
