name: Build GREED PIT 0.20.11 audio candidate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-greed-pit-0211.yml"
      - "tools/build_greed_pit_0211.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build candidate from verified source
        run: python3 tools/build_greed_pit_0211.py

      - name: Check generated game JavaScript
        run: node --check /tmp/greed-pit-0211.js

      - name: Browser smoke test packaged candidate
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser" || { echo "No Chrome/Chromium binary on runner"; exit 1; }
          cat > candidate-0211-smoke.html <<'EOF'
          <!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script type="module">import './loader-0211.js';</script>
          EOF
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/greed-pit-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 1
          "$browser" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=4000 --dump-dom "http://127.0.0.1:8123/candidate-0211-smoke.html?test=1" >/tmp/greed-pit-test-dom.html 2>/tmp/greed-pit-browser.err
          grep -q "ALL TESTS PASSED" /tmp/greed-pit-test-dom.html
          "$browser" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=2500 --dump-dom "http://127.0.0.1:8123/candidate-0211-smoke.html" >/tmp/greed-pit-title-dom.html 2>>/tmp/greed-pit-browser.err
          grep -q "GREED PIT" /tmp/greed-pit-title-dom.html
          grep -q "AUDIO: ON" /tmp/greed-pit-title-dom.html
          echo "Packaged loader + browser self-test + title/audio UI smoke test passed."

      - name: Commit staged candidate
        run: |
          set -euo pipefail
          rm -f candidate-0211-smoke.html
          git config user.name "greed-pit-build-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/greed-pit-0.20.11.html src/greed-pit-0.20.11.sha256 loader-0211.js gp0211.*.b64 manifest-0211.webmanifest sw-0211.js
          if git diff --cached --quiet; then
            echo "0.20.11 candidate already staged."
            exit 0
          fi
          git commit -m "build: stage GREED PIT 0.20.11 audio candidate"
          git push
