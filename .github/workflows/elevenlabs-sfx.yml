name: Generate ElevenLabs SFX

on:
  push:
    branches: [main]
    paths:
      - ".audio-requests/pending/*.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Generate pending sound effects
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$ELEVENLABS_API_KEY" || { echo "ELEVENLABS_API_KEY missing"; exit 1; }
          mkdir -p assets/audio/sfx .audio-requests/processed

          shopt -s nullglob
          requests=(.audio-requests/pending/*.json)
          if [ ${#requests[@]} -eq 0 ]; then
            echo "No pending requests."
            exit 0
          fi

          for request in "${requests[@]}"; do
            python3 - "$request" <<'PY'
          import json, pathlib, re, sys
          p = pathlib.Path(sys.argv[1])
          r = json.loads(p.read_text())
          name = r.get("name")
          text = r.get("text")
          duration = r.get("duration_seconds", 1.0)
          loop = r.get("loop", False)
          influence = r.get("prompt_influence", 0.4)
          output = r.get("output_path") or f"assets/audio/sfx/{name}.mp3"
          if not isinstance(name, str) or not re.fullmatch(r"[a-z0-9][a-z0-9_-]{0,63}", name):
              raise SystemExit("invalid name")
          if not isinstance(text, str) or not (1 <= len(text) <= 450):
              raise SystemExit("invalid text")
          if not isinstance(duration, (int, float)) or not (0.5 <= float(duration) <= 30):
              raise SystemExit("invalid duration")
          if not isinstance(loop, bool):
              raise SystemExit("invalid loop")
          if not isinstance(influence, (int, float)) or not (0 <= float(influence) <= 1):
              raise SystemExit("invalid prompt influence")
          out = pathlib.PurePosixPath(output)
          if out.is_absolute() or ".." in out.parts or not str(out).startswith("assets/audio/") or out.suffix.lower() != ".mp3":
              raise SystemExit("invalid output path")
          payload = {
              "text": text,
              "duration_seconds": float(duration),
              "loop": loop,
              "prompt_influence": float(influence),
              "model_id": "eleven_text_to_sound_v2",
          }
          pathlib.Path("/tmp/elevenlabs_payload.json").write_text(json.dumps(payload))
          pathlib.Path("/tmp/elevenlabs_output.txt").write_text(str(out))
          PY

            output="$(cat /tmp/elevenlabs_output.txt)"
            mkdir -p "$(dirname "$output")"
            code="$(curl --silent --show-error \
              --output /tmp/elevenlabs_response.bin \
              --write-out '%{http_code}' \
              --request POST \
              --url 'https://api.elevenlabs.io/v1/sound-generation?output_format=mp3_44100_128' \
              --header "xi-api-key: $ELEVENLABS_API_KEY" \
              --header 'Content-Type: application/json' \
              --data-binary '@/tmp/elevenlabs_payload.json')"

            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "ElevenLabs failed: HTTP $code"
              cat /tmp/elevenlabs_response.bin || true
              exit 1
            fi

            mv /tmp/elevenlabs_response.bin "$output"
            mv "$request" ".audio-requests/processed/$(basename "$request")"
          done

      - name: Commit generated audio
        run: |
          set -euo pipefail
          git config user.name "greed-pit-audio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio .audio-requests
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "audio: generate ElevenLabs sound effects"
          git push
