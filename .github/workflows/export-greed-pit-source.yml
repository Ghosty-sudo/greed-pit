name: Export GREED PIT canonical source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-greed-pit-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified 0.20.9 source through its release loader
        run: |
          set -euo pipefail
          mkdir -p src
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const crypto = require('crypto');

          globalThis.crypto = globalThis.crypto || crypto.webcrypto;
          globalThis.fetch = async (url) => {
            const file = String(url).replace(/^\.\//, '');
            if (!fs.existsSync(file)) return new Response('', {status: 404});
            return new Response(fs.readFileSync(file), {status: 200});
          };

          let written = false;
          globalThis.document = {
            body: {innerHTML: ''},
            open() {},
            write(html) {
              fs.writeFileSync('src/greed-pit-0.20.9.html', html);
              written = true;
            },
            close() {}
          };

          (async () => {
            const code = fs.readFileSync('loader-0209.js', 'utf8');
            await vm.runInThisContext(code, {filename: 'loader-0209.js'});
            if (!written) throw new Error('0.20.9 loader did not emit canonical source: ' + document.body.innerHTML);
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

          actual="$(sha256sum src/greed-pit-0.20.9.html | awk '{print $1}')"
          expected="ed73fd1a4e4e8cf0c442d6c89ed0864a0d38aec9bb99bf91c41c30679a60302d"
          test "$actual" = "$expected" || {
            echo "0.20.9 source hash mismatch: $actual"
            exit 1
          }
          grep -q "GREED PIT 0.20.9 RELEASE CANDIDATE" src/greed-pit-0.20.9.html
          echo "Verified canonical 0.20.9 source: $actual"

      - name: Commit verified canonical source
        run: |
          set -euo pipefail
          git config user.name "greed-pit-build-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/greed-pit-0.20.9.html
          if git diff --cached --quiet; then
            echo "Verified source already exported."
            exit 0
          fi
          git commit -m "build: export verified GREED PIT 0.20.9 canonical source"
          git push
